<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign In | Muhammad Salman</title>

<style>
:root{
    --bg:#07111f;
    --card:#0d1c30;
    --input:#071525;
    --text:#f2f7ff;
    --muted:#a9b8ca;
    --primary:#60a5fa;
    --primary2:#2563eb;
    --secondary:#7c3aed;
    --border:rgba(96,165,250,.20);
    --danger:#f87171;
    --success:#4ade80;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 15% 20%,rgba(37,99,235,.22),transparent 32%),
        radial-gradient(circle at 85% 80%,rgba(124,58,237,.20),transparent 30%),
        var(--bg);
    color:var(--text);
    display:grid;
    place-items:center;
    padding:24px;
    overflow-x:hidden;
}

/* Background Glow */
body::before{
    content:"";
    position:fixed;
    width:280px;
    height:280px;
    border-radius:50%;
    border:1px solid rgba(96,165,250,.10);
    top:8%;
    right:8%;
    pointer-events:none;
}

body::after{
    content:"";
    position:fixed;
    width:220px;
    height:220px;
    border-radius:50%;
    border:1px solid rgba(167,139,250,.08);
    bottom:8%;
    left:8%;
    pointer-events:none;
}

/* Main Card */
.card{
    width:min(470px,100%);
    background:rgba(13,28,48,.92);
    border:1px solid var(--border);
    border-radius:28px;
    padding:36px;
    box-shadow:
        0 30px 90px rgba(0,0,0,.48),
        0 0 0 1px rgba(255,255,255,.02);
    backdrop-filter:blur(20px);
    position:relative;
    z-index:2;
}

/* Top Accent */
.card::before{
    content:"";
    position:absolute;
    top:0;
    left:12%;
    right:12%;
    height:2px;
    background:linear-gradient(90deg,transparent,var(--primary),var(--secondary),transparent);
    border-radius:50%;
}

/* Logo */
.logo{
    width:68px;
    height:68px;
    border-radius:20px;
    object-fit:cover;
    border:2px solid var(--primary);
    display:block;
    margin-bottom:22px;
    box-shadow:
        0 10px 30px rgba(37,99,235,.25),
        0 0 0 5px rgba(96,165,250,.06);
}

/* Heading */
.eyebrow{
    color:var(--primary);
    font-size:12px;
    font-weight:900;
    letter-spacing:1.4px;
}

.card h1{
    font-size:clamp(30px,7vw,38px);
    margin:8px 0 9px;
    letter-spacing:-.5px;
}

.sub{
    color:var(--muted);
    line-height:1.65;
    margin-bottom:28px;
    font-size:14px;
}

/* Fields */
.field{
    margin-bottom:18px;
}

.field label{
    display:block;
    font-size:13px;
    font-weight:800;
    margin-bottom:8px;
}

.input-wrap{
    position:relative;
}

.field input{
    width:100%;
    padding:14px 15px;
    border-radius:13px;
    border:1px solid var(--border);
    background:var(--input);
    color:var(--text);
    outline:none;
    font-size:15px;
    transition:.25s ease;
}

.field input.password-input{
    padding-right:76px;
}

.field input::placeholder{
    color:#718198;
}

.field input:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 4px rgba(96,165,250,.11);
    transform:translateY(-1px);
}

/* Show Password */
.toggle-password{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    width:auto;
    padding:7px 9px;
    border:0;
    background:transparent;
    color:var(--primary);
    font-size:12px;
    font-weight:800;
    cursor:pointer;
    box-shadow:none;
}

.toggle-password:hover{
    color:#bfdbfe;
}

/* Login Button */
.login-btn{
    width:100%;
    border:0;
    border-radius:14px;
    padding:15px;
    font-size:15px;
    font-weight:900;
    color:#fff;
    background:linear-gradient(135deg,var(--primary2),var(--secondary));
    cursor:pointer;
    box-shadow:0 14px 30px rgba(37,99,235,.25);
    transition:.25s ease;
    position:relative;
    overflow:hidden;
}

.login-btn::after{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:60%;
    height:100%;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.18),
        transparent
    );
    transform:skewX(-20deg);
    transition:.55s ease;
}

.login-btn:hover::after{
    left:130%;
}

.login-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 18px 36px rgba(37,99,235,.32);
}

.login-btn:active{
    transform:translateY(0);
}

.login-btn:disabled{
    opacity:.65;
    cursor:not-allowed;
    transform:none;
}

/* Message */
.msg{
    min-height:24px;
    margin:14px 0 3px;
    font-size:13px;
    line-height:1.5;
    text-align:center;
}

.msg.error{
    color:var(--danger);
}

.msg.success{
    color:var(--success);
}

/* Security Note */
.security{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    margin-top:17px;
    color:#8fa2b9;
    font-size:11px;
}

.security-icon{
    color:var(--success);
    font-size:13px;
}

/* Hint */
.hint{
    margin-top:22px;
    padding:13px 15px;
    border:1px solid var(--border);
    border-radius:13px;
    color:var(--muted);
    background:rgba(7,21,37,.45);
    font-size:11px;
    line-height:1.7;
}

.hint b{
    color:#dbeafe;
}

/* Back Button */
.back{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    color:var(--muted);
    margin-top:20px;
    font-size:13px;
    text-decoration:none;
    transition:.2s ease;
}

.back:hover{
    color:var(--primary);
}

/* Mobile */
@media(max-width:520px){

    body{
        padding:16px;
    }

    .card{
        padding:28px 22px;
        border-radius:23px;
    }

    .logo{
        width:60px;
        height:60px;
        border-radius:18px;
    }

    .card h1{
        font-size:32px;
    }

    .sub{
        font-size:13px;
    }
}

/* Reduced Motion */
@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        scroll-behavior:auto!important;
        transition:none!important;
        animation:none!important;
    }
}
</style>
</head>

<body>

<main class="card">

    <img
        class="logo"
        src="image.jpeg"
        alt="Muhammad Salman"
    >

    <div class="eyebrow">PRIVATE ADMIN AREA</div>

    <h1>Sign In</h1>

    <p class="sub">
        Sign in to access your private dashboard and manage
        messages received through your portfolio.
    </p>

    <form id="loginForm">

        <!-- Username -->
        <div class="field">
            <label for="username">Username</label>

            <div class="input-wrap">
                <input
                    id="username"
                    name="username"
                    type="text"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                >
            </div>
        </div>

        <!-- Password -->
        <div class="field">
            <label for="password">Password</label>

            <div class="input-wrap">

                <input
                    id="password"
                    name="password"
                    class="password-input"
                    type="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    id="togglePassword"
                >
                    Show
                </button>

            </div>
        </div>

        <!-- Login -->
        <button
            id="loginBtn"
            class="login-btn"
            type="submit"
        >
            Sign In →
        </button>

        <div
            id="msg"
            class="msg"
            aria-live="polite"
        ></div>

    </form>

    <div class="security">
        <span class="security-icon">●</span>
        Secure local session
    </div>

    <div class="hint">
        <b>Local Node.js Dashboard</b><br>
        Run <b>node server.js</b> and open this page through
        <b>http://localhost:3000/signin.html</b>.
    </div>

    <a
        class="back"
        href="index.html"
    >
        ← Back to Portfolio
    </a>

</main>

<script>

const form = document.getElementById("loginForm");
const btn = document.getElementById("loginBtn");
const msg = document.getElementById("msg");

const password = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");


/* Show / Hide Password */

togglePassword.addEventListener("click", () => {

    if(password.type === "password"){

        password.type = "text";
        togglePassword.textContent = "Hide";

    }else{

        password.type = "password";
        togglePassword.textContent = "Show";

    }

});


/* Login */

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    btn.disabled = true;
    btn.textContent = "Signing in...";
    
    msg.textContent = "";
    msg.className = "msg";

    try{

        const response = await fetch("/login", {

            method:"POST",

            credentials:"same-origin",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                username:form.username.value.trim(),

                password:form.password.value

            })

        });


        let data = {};

        try{
            data = await response.json();
        }catch{
            data = {};
        }


        if(!response.ok){

            throw new Error(
                data.message || "Invalid username or password."
            );

        }


        msg.textContent = "Login successful. Opening dashboard...";
        msg.className = "msg success";

        btn.textContent = "Opening Dashboard...";


        // Use an absolute same-origin path so the dashboard opens correctly
        // whether this page is loaded from /signin.html or another route.
        setTimeout(() => {
            window.location.assign("/dashboard.html");
        }, 300);


    }catch(error){

        msg.textContent =
            error.message ||
            "Unable to sign in. Make sure Node.js server is running at http://localhost:3000.";

        msg.className = "msg error";

        btn.disabled = false;

        btn.textContent = "Sign In →";

    }

});

</script>

</body>
</html>
